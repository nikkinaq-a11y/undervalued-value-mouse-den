<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cozy Mouse Den</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="den" id="den">
    <img class="den-bg" src="assets/images/den_bg.png" alt="A cozy underground mouse den with a fireplace, couch, and bookshelf." />

    <button class="zone zone-fireplace" id="zone-fire" aria-label="Fireplace"></button>
    <button class="zone zone-couch" id="zone-movie" aria-label="Couch"></button>
    <button class="zone zone-bookshelf" id="zone-read" aria-label="Bookshelf"></button>

    <div class="mouse" id="mouse"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
