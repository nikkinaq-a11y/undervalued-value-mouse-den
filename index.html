<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cozy Mouse Den</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="den" id="den">
    <div class="room-bg"></div>

    <button class="zone zone-fireplace" id="zone-fire" aria-label="Fireplace">
      <div class="fireplace"></div>
    </button>

    <button class="zone zone-couch" id="zone-movie" aria-label="Couch">
      <div class="couch"></div>
    </button>

    <button class="zone zone-bookshelf" id="zone-read" aria-label="Bookshelf">
      <div class="bookshelf"></div>
    </button>

    <div class="mouse" id="mouse"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
