<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cozy Mouse Den</title>
  <!-- The ?v= is a cache buster. GitHub Pages serves these with a ten minute
       cache, so a visitor who has been here before can end up holding an old
       script.js against a new index.html -- which is not a broken-looking page
       but a dead one, since the old script throws on markup that has moved on
       and never gets as far as placing the mouse. Bump the number whenever
       script.js, style.css or a decoration image changes -- the decorations are
       rebuilt under their existing filenames, so without a stamp a returning
       visitor keeps the previous build of them. The room's own art is not
       stamped: it is only ever added to, never rewritten. -->
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <!-- Pinned to the corner of the window, out of the stage entirely: the row
       under the frame is what the mouse can be asked to do, and this is a
       setting of the room rather than one of them. A switch says so on sight. -->
  <div class="holidaybar">
    <button type="button" class="holiday-toggle" id="holiday" aria-pressed="false">
      <span class="holiday-text">Holiday mode</span>
      <span class="holiday-switch"><span class="holiday-knob"></span></span>
    </button>
  </div>

  <div class="stage">
  <main class="den" id="den">
    <!-- The room is painted in two lighting states. The lit one is always
         there; the dark one fades over it while the mouse watches a movie. -->
    <img class="layer room" src="assets/images/den_bg.png"
         alt="A cozy underground mouse den with a fireplace, a television, a couch, and a braided rug." />

    <!-- Overlays sit on the lit room only: registered crops of the same
         painting, so they drop back into place with no seam. -->
    <img class="layer tv-off" id="tv-off" src="assets/images/tv_off.png" alt="" />
    <img class="layer fire" id="fire" src="assets/images/fire_a.png" alt="" />

    <button class="zone zone-tv" id="zone-tv" aria-pressed="false"
            aria-label="Television"></button>
    <button class="zone zone-fireplace" id="zone-fire" aria-label="Fireplace"></button>
    <button class="zone zone-rug" id="zone-read" aria-label="Rug"></button>
    <button class="zone zone-couch" id="zone-movie" aria-label="Couch"></button>

    <div class="mouse" id="mouse"></div>

    <!-- Scenes are the same room with the mouse painted into it. `scene` cuts
         straight in; `scene-fade` is the only thing in the piece that fades,
         carrying the lamps down once the mouse is already on the couch. -->
    <img class="layer scene" id="scene" alt="" />
    <img class="layer scene-fade" id="scene-fade" alt="" />

    <!-- Just the television's glass, so the picture can move while a movie is
         on without another copy of the whole room. -->
    <img class="layer tv-movie" id="tv-movie" alt="" />

    <!-- Holiday decorations, hung above every other layer so they stay in the
         room through the painted scenes as well. Two copies of the set: the lit
         one, and the same pieces at the room's measured 0.55 dim, which fades in
         with the lamps so they do not glow against a dark room. -->
    <div class="decor-set" id="decor" aria-hidden="true">
      <div class="decor decor-lit">
        <img class="decor-portrait-a" src="assets/images/decor_portrait_a.png?v=2" alt="" />
        <img class="decor-portrait-b" src="assets/images/decor_portrait_b.png?v=2" alt="" />
        <img class="decor-portrait-c" src="assets/images/decor_portrait_c.png?v=2" alt="" />
        <img class="decor-hat" src="assets/images/decor_hat.png?v=2" alt="" />
        <img class="decor-cauldron" src="assets/images/decor_cauldron.png?v=2" alt="" />
        <img class="decor-pumpkin-a" src="assets/images/decor_pumpkin_a.png?v=2" alt="" />
        <img class="decor-pumpkin-b" src="assets/images/decor_pumpkin_b.png?v=2" alt="" />
        <img class="decor-pumpkin-c" src="assets/images/decor_pumpkin_c.png?v=2" alt="" />
      </div>
      <div class="decor decor-dark">
        <img class="decor-portrait-a" src="assets/images/decor_portrait_a_dark.png?v=2" alt="" />
        <img class="decor-portrait-b" src="assets/images/decor_portrait_b_dark.png?v=2" alt="" />
        <img class="decor-portrait-c" src="assets/images/decor_portrait_c_dark.png?v=2" alt="" />
        <img class="decor-hat" src="assets/images/decor_hat_dark.png?v=2" alt="" />
        <img class="decor-cauldron" src="assets/images/decor_cauldron_dark.png?v=2" alt="" />
        <img class="decor-pumpkin-a" src="assets/images/decor_pumpkin_a_dark.png?v=2" alt="" />
        <img class="decor-pumpkin-b" src="assets/images/decor_pumpkin_b_dark.png?v=2" alt="" />
        <img class="decor-pumpkin-c" src="assets/images/decor_pumpkin_c_dark.png?v=2" alt="" />
      </div>
    </div>
  </main>

  <div class="controlbar">
  <nav class="controls" aria-label="What the mouse is doing">
    <button type="button" class="control" data-mode="movie" aria-pressed="false">Movie</button>
    <button type="button" class="control" data-mode="cocoa" aria-pressed="false">Cocoa</button>
    <button type="button" class="control" data-mode="fire" aria-pressed="false">Feed fire</button>
    <button type="button" class="control" data-mode="chill" aria-pressed="false">Chill</button>
    <button type="button" class="control" data-mode="wander" aria-pressed="false">Wander</button>
  </nav>

  <!-- Kept out of the nav above: that group is what the mouse is doing, this is
       just the room's own sound. It opens the playlist in its own tab rather
       than playing in the page, so the visitor keeps Spotify's own controls --
       and a real link, so it middle-clicks and cmd-clicks like any other. -->
  <a class="control control-sound" id="sound" target="_blank" rel="noopener"
     href="https://open.spotify.com/playlist/7fh2Bqm3z34GNX3tsIfmSl">Music</a>
  </div>

  </div>

  <script src="script.js?v=2"></script>
</body>
</html>
